<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Login Failed - Kisan Direct Marketplace</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>

        body {
            background-color: #f8f9fa;
            font-family: Arial, Helvetica, sans-serif;
        }

        .failed-box {
            max-width: 500px;
            margin: 100px auto;
            padding: 40px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.15);
            text-align: center;
        }

        .error-icon {
            font-size: 60px;
            margin-bottom: 20px;
        }

        .failed-title {
            color: #dc3545;
            font-weight: bold;
        }

    </style>

</head>

<body>

    <div class="container">

        <div class="failed-box">

            <div class="error-icon">
                ❌
            </div>

            <h1 class="failed-title">
                Login Failed
            </h1>

            <p class="mt-3">
                Invalid email or password.
            </p>

            <p class="text-muted">
                Please check your email and password
                and try again.
            </p>

            <a
                href="/login"
                class="btn btn-success mt-3">

                🔑 Try Again

            </a>

            <br>

            <a
                href="/"
                class="btn btn-outline-success mt-3">

                🏠 Back to Home

            </a>

        </div>

    </div>

</body>

</html>
