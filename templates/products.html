<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Products - Kisan Direct Marketplace</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f8f5;
            color: #333;
        }

        /* NAVBAR */

        .navbar {
            background: #198754;
            color: white;
            padding: 15px 35px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        .logo {
            font-size: 23px;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 15px;
        }

        .nav-links a:hover {
            text-decoration: underline;
        }

        /* PRODUCTS */

        .products-section {
            padding: 40px 30px;
            min-height: 100vh;
        }

        .products-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .products-header h1 {
            color: #176b35;
            font-size: 32px;
            margin-bottom: 8px;
        }

        .products-header p {
            color: #666;
        }

        /* CATEGORY BUTTONS */

        .category-buttons {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 30px;
        }

        .category-buttons button {
            border: none;
            background: #198754;
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }

        .category-buttons button:hover {
            background: #146c43;
        }

        .category-buttons button.active {
            background: #0d5131;
        }

        /* PRODUCT GRID */

        .product-grid {
            max-width: 1400px;
            margin: auto;

            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(230px, 1fr));

            gap: 25px;
        }

        /* CARD */

        .product-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;

            box-shadow:
                0 3px 12px rgba(0,0,0,0.10);

            transition: 0.3s;
        }

        .product-card:hover {
            transform: translateY(-5px);

            box-shadow:
                0 8px 20px rgba(0,0,0,0.15);
        }

        .product-card img {
            width: 100%;
            height: 190px;

            object-fit: cover;
            display: block;

            background: #eee;
        }

        .product-info {
            padding: 16px;
        }

        .product-name {
            font-size: 19px;
            font-weight: bold;
            margin-bottom: 7px;
        }

        .product-category {
            color: #777;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .product-price {
            color: #198754;
            font-size: 19px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .product-farmer {
            color: #666;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .product-location {
            color: #888;
            font-size: 12px;
            margin-bottom: 14px;
        }

        /* ADD TO CART */

        .cart-form {
            width: 100%;
        }

        .buy-btn {
            width: 100%;

            border: none;
            padding: 11px;

            border-radius: 7px;

            background: #198754;
            color: white;

            font-size: 15px;
            font-weight: bold;

            cursor: pointer;
        }

        .buy-btn:hover {
            background: #146c43;
        }

        /* MESSAGE */

        #cartMessage {
            display: none;

            position: fixed;
            top: 20px;
            right: 20px;

            background: #198754;
            color: white;

            padding: 15px 22px;

            border-radius: 8px;

            box-shadow:
                0 4px 15px rgba(0,0,0,0.2);

            z-index: 9999;

            font-weight: bold;
        }

        /* FOOTER */

        footer {
            background: #176b35;
            color: white;

            text-align: center;

            padding: 20px;
            margin-top: 20px;
        }

        footer p {
            margin: 5px 0;
        }

        /* MOBILE */

        @media (max-width: 600px) {

            .navbar {
                flex-direction: column;
                gap: 12px;
                padding: 15px;
            }

            .nav-links {
                flex-wrap: wrap;
                justify-content: center;
            }

            .products-section {
                padding: 25px 15px;
            }

            .products-header h1 {
                font-size: 27px;
            }

            .product-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

/* =========================================================
   DISPLAY PRODUCTS
========================================================= */

function displayProducts(productList) {

    const productGrid =
        document.getElementById("productGrid");

    productGrid.innerHTML = "";


    if (productList.length === 0) {

        productGrid.innerHTML = `
            <div style="
                grid-column: 1 / -1;
                text-align: center;
                padding: 50px;
            ">
                <h2>No products found</h2>
            </div>
        `;

        return;
    }


    productList.forEach(function(product) {

        const card =
            document.createElement("div");

        card.className =
            "product-card";


        card.innerHTML = `

            <img
                src="${product.image}"
                alt="${product.name}"
                loading="lazy"
                onerror="
                    this.onerror=null;
                    this.src='https://placehold.co/800x500?text=No+Image';
                "
            >

            <div class="product-info">

                <div class="product-name">
                    ${product.name}
                </div>

                <div class="product-category">
                    ${product.category}
                </div>

                <div class="product-price">
                    ₹${product.price} / ${product.unit}
                </div>

                <div class="product-farmer">
                    👨‍🌾 Farmer: ${product.farmer}
                </div>

                <div class="product-location">
                    📍 ${product.location}
                </div>


                <form
                    class="cart-form"
                    action="/add-to-cart"
                    method="POST"
                    onsubmit="return addToCart(this)"
                >

                    <input
                        type="hidden"
                        name="product_id"
                        value="${product.id}"
                    >

                    <input
                        type="hidden"
                        name="product_name"
                        value="${product.name}"
                    >

                    <input
                        type="hidden"
                        name="price"
                        value="${product.price}"
                    >

                    <input
                        type="hidden"
                        name="unit"
                        value="${product.unit}"
                    >

                    <input
                        type="hidden"
                        name="farmer"
                        value="${product.farmer}"
                    >

                    <input
                        type="hidden"
                        name="location"
                        value="${product.location}"
                    >

                    <input
                        type="hidden"
                        name="image"
                        value="${product.image}"
                    >

                    <button
                        type="submit"
                        class="buy-btn"
                    >
                        🛒 Add to Cart
                    </button>

                </form>

            </div>
        `;


        productGrid.appendChild(card);

    });

}


/* =========================================================
   ADD TO CART
========================================================= */

function addToCart(form) {

    const formData =
        new FormData(form);


    fetch("/add-to-cart", {

        method: "POST",

        body: formData

    })

    .then(function(response) {

        if (response.redirected) {

            window.location.href =
                response.url;

            return;
        }


        if (!response.ok) {

            throw new Error(
                "Failed to add product"
            );
        }


        return response.text();

    })

    .then(function() {

        showCartMessage();

    })

    .catch(function(error) {

        console.error(error);

        alert(
            "Unable to add product to cart. Please login again."
        );

    });


    return false;
}


/* =========================================================
   CART MESSAGE
========================================================= */

function showCartMessage() {

    const message =
        document.getElementById("cartMessage");


    message.style.display = "block";


    setTimeout(function() {

        message.style.display = "none";

    }, 2000);

}


/* =========================================================
   CATEGORY FILTER
========================================================= */

function filterProducts(category, button) {

    document
        .querySelectorAll(
            ".category-buttons button"
        )
        .forEach(function(btn) {

            btn.classList.remove("active");

        });


    if (button) {

        button.classList.add("active");

    }


    if (category === "All") {

        displayProducts(products);

    } else {

        const filteredProducts =
            products.filter(function(product) {

                return product.category === category;

            });


        displayProducts(filteredProducts);

    }

}


/* =========================================================
   LOAD PRODUCTS
========================================================= */

displayProducts(products);
