<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Order Successful - Kisan Direct Marketplace</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f8f5;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        .success-box {
            background: white;
            width: 90%;
            max-width: 600px;

            padding: 45px 30px;

            text-align: center;

            border-radius: 15px;

            box-shadow:
                0 4px 15px rgba(0,0,0,0.12);
        }

        .success-icon {
            font-size: 70px;
            margin-bottom: 15px;
        }

        h1 {
            color: #198754;
            margin-bottom: 10px;
        }

        p {
            color: #666;
            margin-bottom: 25px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-block;

            padding: 12px 22px;

            border-radius: 7px;

            text-decoration: none;

            font-weight: bold;
        }

        .orders-btn {
            background: #198754;
            color: white;
        }

        .shop-btn {
            background: white;
            color: #198754;

            border: 1px solid #198754;
        }

        .orders-btn:hover {
            background: #146c43;
        }

        .shop-btn:hover {
            background: #198754;
            color: white;
        }

    </style>

</head>


<body>


<div class="success-box">

    <div class="success-icon">
        ✅
    </div>

    <h1>
        Order Placed Successfully!
    </h1>

    <p>
        Thank you for shopping with Kisan Direct Marketplace.
    </p>

    <p>
        Your order has been saved successfully.
    </p>


    <div class="buttons">

        <a
            href="/orders"
            class="btn orders-btn"
        >
            📦 View My Orders
        </a>


        <a
            href="/buyer"
            class="btn shop-btn"
        >
            🛒 Continue Shopping
        </a>

    </div>

</div>


</body>

</html>
