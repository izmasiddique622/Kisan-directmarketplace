<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Products - Kisan Direct Marketplace</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f8f5;
            color: #222;
        }

        /* ================= NAVBAR ================= */

        .navbar {
            background: #198754;
            color: white;
            padding: 15px 35px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 15px;
        }

        .nav-links a:hover {
            text-decoration: underline;
        }

        /* ================= PRODUCTS SECTION ================= */

        .products-section {
            padding: 40px 30px;
            min-height: 100vh;
        }

        .products-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .products-header h1 {
            font-size: 32px;
            color: #176b35;
            margin-bottom: 8px;
        }

        .products-header p {
            color: #666;
            font-size: 16px;
        }

        /* ================= CATEGORY BUTTONS ================= */

        .category-buttons {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 30px;
        }

        .category-buttons button {
            border: none;
            background: #198754;
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: 0.3s;
        }

        .category-buttons button:hover {
            background: #146c43;
            transform: translateY(-2px);
        }

        .category-buttons button.active {
            background: #0f5132;
        }

        /* ================= PRODUCT GRID ================= */

        .product-grid {
            max-width: 1400px;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 25px;
        }

        /* ================= PRODUCT CARD ================= */

        .product-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.10);
            transition: 0.3s;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }

        /* ================= PRODUCT IMAGE ================= */

        .product-card img {
            width: 100%;
            height: 190px;
            object-fit: cover;
            display: block;
            background: #eeeeee;
        }

        /* ================= PRODUCT INFORMATION ================= */

        .product-info {
            padding: 16px;
        }

        .product-name {
            font-size: 19px;
            font-weight: bold;
            color: #222;
            margin-bottom: 7px;
        }

        .product-category {
            font-size: 14px;
            color: #777;
            margin-bottom: 8px;
        }

        .product-price {
            font-size: 19px;
            font-weight: bold;
            color: #198754;
            margin-bottom: 8px;
        }

        .product-farmer {
            font-size: 13px;
            color: #666;
            margin-bottom: 8px;
        }

        .product-location {
            font-size: 12px;
            color: #888;
            margin-bottom: 14px;
        }

        /* ================= ADD TO CART ================= */

        .buy-btn {
            width: 100%;
            border: none;
            padding: 11px;
            border-radius: 7px;
            background: #198754;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .buy-btn:hover {
            background: #146c43;
        }

        /* ================= CART MESSAGE ================= */

        .cart-message {
            position: fixed;
            right: 20px;
            bottom: 20px;
            background: #198754;
            color: white;
            padding: 14px 20px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            display: none;
            z-index: 9999;
        }

        /* ================= FOOTER ================= */

        footer {
            background: #176b35;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 30px;
        }

        footer p {
            margin: 5px 0;
        }

        /* ================= MOBILE ================= */

        @media (max-width: 700px) {

            .navbar {
                flex-direction: column;
                gap: 12px;
                padding: 15px 20px;
            }

            .logo {
                font-size: 20px;
            }

            .products-section {
                padding: 25px 15px;
            }

            .products-header h1 {
                font-size: 26px;
            }

            .product-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

/* =========================================================
   DISPLAY PRODUCTS
========================================================= */

function displayProducts(productList) {

    const productGrid =
        document.getElementById("productGrid");

    productGrid.innerHTML = "";

    if (productList.length === 0) {

        productGrid.innerHTML = `
            <div style="
                grid-column: 1 / -1;
                text-align: center;
                padding: 50px;
                background: white;
                border-radius: 12px;
            ">
                <h2>No products found</h2>
                <p>Please select another category.</p>
            </div>
        `;

        return;
    }


    productList.forEach(function(product) {

        const card =
            document.createElement("div");

        card.className =
            "product-card";


        card.innerHTML = `

            <img
                src="${product.image}"
                alt="${product.name}"
                onerror="
                    this.onerror=null;
                    this.src='https://placehold.co/800x500?text=Product+Image';
                "
            >

            <div class="product-info">

                <div class="product-name">
                    ${product.name}
                </div>

                <div class="product-category">
                    ${product.category}
                </div>

                <div class="product-price">
                    ₹${product.price} / ${product.unit}
                </div>

                <div class="product-farmer">
                    Farmer: ${product.farmer}
                </div>

                <div class="product-location">
                    📍 ${product.location}
                </div>

                <button
                    class="buy-btn"
                    onclick="addToCart(${product.id})"
                >
                    🛒 Add to Cart
                </button>

            </div>
        `;


        productGrid.appendChild(card);

    });

}


/* =========================================================
   FILTER PRODUCTS
========================================================= */

function filterProducts(category, clickedButton) {

    const buttons =
        document.querySelectorAll(
            ".category-buttons button"
        );

    buttons.forEach(function(button) {

        button.classList.remove("active");

    });


    if (clickedButton) {

        clickedButton.classList.add("active");

    }


    if (category === "All") {

        displayProducts(products);

        return;

    }


    const filteredProducts =
        products.filter(function(product) {

            return product.category === category;

        });


    displayProducts(filteredProducts);

}


/* =========================================================
   ADD TO CART
========================================================= */

function addToCart(productId) {

    const product =
        products.find(function(item) {

            return item.id === productId;

        });


    if (!product) {

        alert("Product not found!");

        return;

    }


    let cart =
        JSON.parse(
            localStorage.getItem("cart")
        ) || [];


    const existingProduct =
        cart.find(function(item) {

            return item.id === productId;

        });


    if (existingProduct) {

        existingProduct.quantity =
            (existingProduct.quantity || 1) + 1;

    } else {

        const cartProduct = {

            id: product.id,

            name: product.name,

            category: product.category,

            price: product.price,

            unit: product.unit,

            farmer: product.farmer,

            location: product.location,

            image: product.image,

            quantity: 1

        };


        cart.push(cartProduct);

    }


    localStorage.setItem(
        "cart",
        JSON.stringify(cart)
    );


    showCartMessage(
        product.name + " added to cart!"
    );

}


/* =========================================================
   CART MESSAGE
========================================================= */

function showCartMessage(message) {

    const cartMessage =
        document.getElementById("cartMessage");


    cartMessage.textContent =
        "✓ " + message;


    cartMessage.style.display =
        "block";


    setTimeout(function() {

        cartMessage.style.display =
            "none";

    }, 2000);

}


/* =========================================================
   INITIAL LOAD
========================================================= */

displayProducts(products);

</script>
